name: kuantoconta desktop CI
on:
  push:
    branches:
      - main
      - ci/**
      - docs/**
      - feat/**
      - fix/**
      - test/**
  pull_request:
    branches:
      - main
      - feat/**
      - fix/**
      - test/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEON_AUTH_BASE_URL: https://example.neonauth.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-secret-do-not-use-in-production-123456
      SIGNUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Finance domain tests
        run: npm test
      - name: Next.js build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kc_ci
          POSTGRES_PASSWORD: kc_ci_password
          POSTGRES_DB: kuantoconta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: kc_ci
      PGPASSWORD: kc_ci_password
      PGDATABASE: kuantoconta_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply migrations in order
        run: |
          for file in apps/web/db/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $file..."
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify core tables and functions
        run: |
          psql -v ON_ERROR_STOP=1 -c "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN (
                'kc_wallets',
                'kc_titles',
                'kc_settlements',
                'kc_categories',
                'kc_budget_rules',
                'kc_budget_periods',
                'kc_economic_events'
              )
            ORDER BY table_name;
          "
          psql -v ON_ERROR_STOP=1 -c "
            SELECT routine_name FROM information_schema.routines
            WHERE routine_schema = 'public'
              AND routine_name IN (
                'kc_settle_title',
                'kc_reverse_settlement',
                'kc_create_financial_event',
                'kc_edit_title_and_event'
              )
            ORDER BY routine_name;
          "
