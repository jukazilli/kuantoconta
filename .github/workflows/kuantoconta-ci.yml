name: kuantoconta desktop CI
on:
  push:
    branches:
      - feat/foundation-desktop-v1
      - feat/ux-money-range-movements
      - fix/finance-display-settlement-undo-recurring
      - feat/scoped-cancel-financial-series
      - feat/bud-*
      - test/bud-*
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEON_AUTH_BASE_URL: https://example.neonauth.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-secret-do-not-use-in-production-123456
      SIGNUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Finance domain tests
        run: npm test
      - name: Next.js build
        run: npm run build
