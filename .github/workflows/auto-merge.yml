name: Auto-merge labeled PRs
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
permissions:
  contents: write
  pull-requests: write
jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Enable GitHub auto-merge
        run: |
          # Requer "Allow auto-merge" habilitado em Settings -> General -> Pull Requests
          # e Branch Protection na main exigindo os checks "verify" e "migrations".
          gh pr merge "$PR_NUMBER" --auto --merge --repo "${{ github.repository }}"
